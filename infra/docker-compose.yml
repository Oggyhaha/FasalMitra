version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: fasalmitra-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./fasalmitra.db
      - USE_MOCK_FALLBACK=true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: fasalmitra-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
